<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Delete Button</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0b0f19;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      gap: 24px;
    }

    /* Container & Guide Text */
    .hint-text {
      color: #64748b;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
      user-select: none;
    }

    /* Delete Button */
    .delete-btn {
      position: relative;
      outline: none;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: #ffffff;
      padding: 16px 36px;
      border-radius: 9999px;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.45),
                  0 0 20px 2px rgba(139, 92, 246, 0.3);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      user-select: none;
    }

    .delete-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -4px rgba(99, 102, 241, 0.6),
                  0 0 28px 4px rgba(139, 92, 246, 0.4);
    }

    .delete-btn:active {
      transform: translateY(1px);
    }

    .delete-btn.disabled {
      pointer-events: none;
      filter: brightness(0.9);
    }

    /* Trash Can Icon */
    .trash-wrapper {
      position: relative;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center bottom;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .trash-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Lid opening animation */
    .trash-lid {
      transform-origin: 3px 6px;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .trash-wrapper.open .trash-lid {
      transform: rotate(-35deg) translate(-2px, -3px);
    }

    /* Impact shake when a letter drops in */
    .trash-wrapper.impact-shake {
      animation: shake 0.2s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes shake {
      0% { transform: scale(1) rotate(0deg); }
      30% { transform: scale(1.15) rotate(-6deg); }
      60% { transform: scale(0.95) rotate(4deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    /* Liquid inside trash bin */
    .trash-liquid {
      transform-origin: bottom center;
      transform: scaleY(0);
      transition: transform 0.18s ease-out;
      fill: #38bdf8;
    }

    /* Text Wrapper & Letters */
    .text-wrapper {
      position: relative;
      display: flex;
    }

    .letter {
      display: inline-block;
      position: relative;
      transition: opacity 0.2s;
    }

    /* Flying animation for individual letters */
    .letter.flying {
      animation: flyIntoTrash 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    @keyframes flyIntoTrash {
      0% {
        transform: translate(0, 0) rotate(0deg) scale(1);
        opacity: 1;
      }
      40% {
        /* Parabolic arc upward and leftward toward the trash bin */
        transform: translate(calc(var(--fly-dist) * -0.5), -32px) rotate(-15deg) scale(0.85);
        opacity: 1;
      }
      80% {
        /* Landing inside the trash */
        transform: translate(calc(var(--fly-dist) * -1), -6px) rotate(-40deg) scale(0.35);
        opacity: 0.8;
      }
      100% {
        /* Disappears into the bin */
        transform: translate(calc(var(--fly-dist) * -1.02), 4px) rotate(-55deg) scale(0.1);
        opacity: 0;
      }
    }

    /* Reset button */
    .reset-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #94a3b8;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .reset-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
  </style>
</head>
<body>

  <button class="delete-btn" id="deleteBtn">
    <!-- Trash SVG Icon -->
    <div class="trash-wrapper" id="trashWrapper">
      <svg class="trash-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <!-- Mask for liquid inside trash body -->
        <clipPath id="trashClip">
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
        </clipPath>

        <!-- Liquid fill -->
        <rect id="liquid" class="trash-liquid" x="5" y="6" width="14" height="16" clip-path="url(#trashClip)" stroke="none" />

        <!-- Lid Group -->
        <g class="trash-lid" id="trashLid">
          <path d="M3 6h18" />
          <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
        </g>

        <!-- Body -->
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
        <line x1="10" y1="11" x2="10" y2="17" />
        <line x1="14" y1="11" x2="14" y2="17" />
      </svg>
    </div>

    <!-- Text with fly distance per letter -->
    <div class="text-wrapper" id="textWrapper">
      <span class="letter" style="--fly-dist: 36px">D</span>
      <span class="letter" style="--fly-dist: 50px">e</span>
      <span class="letter" style="--fly-dist: 64px">l</span>
      <span class="letter" style="--fly-dist: 76px">e</span>
      <span class="letter" style="--fly-dist: 86px">t</span>
      <span class="letter" style="--fly-dist: 96px">e</span>
    </div>
  </button>

  <p class="hint-text">PRESIONA PARA ELIMINAR</p>

  <button class="reset-btn" id="resetBtn">🔄 Reset Animation</button>

  <script>
    const deleteBtn = document.getElementById('deleteBtn');
    const trashWrapper = document.getElementById('trashWrapper');
    const liquid = document.getElementById('liquid');
    const letters = document.querySelectorAll('.letter');
    const resetBtn = document.getElementById('resetBtn');

    // Synthetic sound effect with Web Audio API (no external audio files required)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTrashDropSound(index) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      // Pitch rises slightly with each letter dropping into the bin
      const baseFreq = 260 + (index * 35);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.5, audioCtx.currentTime + 0.12);

      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.13);
    }

    const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    const liquidLevels = [20, 40, 58, 75, 88, 100];
    let isDeleting = false;

    deleteBtn.addEventListener('click', async () => {
      if (isDeleting) return;
      isDeleting = true;
      deleteBtn.classList.add('disabled');

      // Open trash lid
      trashWrapper.classList.add('open');
      await wait(200);

      // Pour letters one by one
      for (let i = 0; i < letters.length; i++) {
        letters[i].classList.add('flying');

        setTimeout(() => {
          // Fill liquid & shake
          liquid.style.transform = `scaleY(${liquidLevels[i] / 100})`;
          playTrashDropSound(i);

          trashWrapper.classList.remove('impact-shake');
          // Trigger reflow to restart CSS animation
          void trashWrapper.offsetWidth;
          trashWrapper.classList.add('impact-shake');
        }, 300);

        await wait(120);
      }

      // Close trash lid after all letters land
      await wait(350);
      trashWrapper.classList.remove('open');
      trashWrapper.classList.remove('impact-shake');
    });

    // Reset button to test again
    resetBtn.addEventListener('click', () => {
      isDeleting = false;
      deleteBtn.classList.remove('disabled');
      trashWrapper.classList.remove('open', 'impact-shake');
      liquid.style.transform = 'scaleY(0)';
      letters.forEach(letter => {
        letter.classList.remove('flying');
      });
    });
  </script>
</body>
</html>
